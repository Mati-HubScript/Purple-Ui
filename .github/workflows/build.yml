name: Build PurpleUI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win64
            os: windows-latest
          - platform: Android64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: PurpleUI-${{ matrix.platform }}
          path: build/**/*.geode
